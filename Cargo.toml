[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/vaurvik/blend"

[workspace.dependencies]
# internal
blend-time = { path = "crates/time" }
blend-geom = { path = "crates/geom" }
blend-color = { path = "crates/color" }
blend-bitstream = { path = "crates/bitstream" }
blend-isobmff = { path = "crates/isobmff" }
blend-avi = { path = "crates/avi" }
blend-matroska = { path = "crates/matroska" }
blend-mxf = { path = "crates/mxf" }
blend-cfb = { path = "crates/cfb" }
blend-mpegts = { path = "crates/mpegts" }
blend-mpeg2v = { path = "crates/mpeg2v" }
blend-ac3 = { path = "crates/ac3" }
blend-mpa = { path = "crates/mpa" }
blend-ogg = { path = "crates/ogg" }
blend-h264 = { path = "crates/h264" }
blend-hevc = { path = "crates/hevc" }
blend-vp8 = { path = "crates/vp8" }
blend-vp9 = { path = "crates/vp9" }
blend-prores = { path = "crates/prores" }
blend-dnx = { path = "crates/dnx" }
blend-apv = { path = "crates/apv" }
blend-dng = { path = "crates/dng" }
blend-av1 = { path = "crates/av1" }
blend-aac = { path = "crates/aac" }
blend-flac = { path = "crates/flac" }
blend-opus = { path = "crates/opus" }
blend-h264enc = { path = "crates/h264enc" }
blend-audio-dsp = { path = "crates/audio-dsp" }
blend-frame = { path = "crates/frame" }
blend-media = { path = "crates/media" }
blend-codecs = { path = "crates/codecs" }
blend-project = { path = "crates/project" }
blend-edit = { path = "crates/edit" }
blend-interchange = { path = "crates/interchange" }
blend-text = { path = "crates/text" }
blend-captions = { path = "crates/captions" }
blend-speech = { path = "crates/speech" }
blend-tts = { path = "crates/tts" }
blend-tts-text = { path = "crates/tts-text" }
blend-render = { path = "crates/render" }
blend-gpu = { path = "crates/gpu" }
blend-scopes = { path = "crates/scopes" }
blend-export = { path = "crates/export" }
blend-format = { path = "crates/format" }
blend-engine = { path = "crates/engine" }
blend-ui-egui = { path = "crates/ui-egui" }
blend-automation = { path = "crates/automation" }
blend-platform = { path = "crates/platform" }
blend-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
rayon = "1"
proptest = "1"
roxmltree = "0.21"
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.blend-h264]
opt-level = 3

[profile.dev.package.blend-h264enc]
opt-level = 3

[profile.dev.package.blend-hevc]
opt-level = 3

[profile.dev.package.blend-prores]
opt-level = 3

[profile.dev.package.blend-dnx]
opt-level = 3

[profile.dev.package.blend-apv]
opt-level = 3

[profile.dev.package.blend-dng]
opt-level = 3

[profile.dev.package.blend-av1]
opt-level = 3

[profile.dev.package.blend-aac]
opt-level = 3

[profile.dev.package.blend-flac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.blend-audio-dsp]
opt-level = 3

[profile.dev.package.blend-mxf]
opt-level = 3

[profile.dev.package.blend-opus]
opt-level = 3

[profile.dev.package.blend-vp8]
opt-level = 3

[profile.dev.package.blend-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
